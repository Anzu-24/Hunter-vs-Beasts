<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="css/style.css">

  <link rel="manifest" href="manifest.json">
  

  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hunter">
  <link rel="apple-touch-icon" href="assets/icon/icon-192.png">

</head>

<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./service-worker.js")
            .then(() => {
                console.log("Service Worker registered");
            })
            .catch(err => {
                console.log(err);
            });

    });

}
</script>

<div id="achievement-screen" class="hidden">
    <img
        id="achievement-logo"
        src="assets/ui/achievement.png"
        alt="Achievements">

    <div id="achievement-list">
        <div class="achievement-item">
            <span class="lock" id="ach-40">☐</span>
            <div>
                <div class="achievement-title">初心者</div>
                <div class="achievement-desc">40ターン生存</div>
            </div>
        </div>
        <div class="achievement-item">
            <span class="lock" id="ach-50">☐</span>
            <div>
                <div class="achievement-title">一人前</div>
                <div class="achievement-desc">50ターン生存</div>
            </div>
        </div>
        
        <div class="achievement-item">
            <span class="lock" id="ach-80">☐</span>
            <div>
                <div class="achievement-title">プロ</div>
                <div class="achievement-desc">80ターン生存</div>
            </div>
        </div>
        
        <div class="achievement-item">
            <span class="lock" id="ach-100">☐</span>
            <div>
                <div class="achievement-title">伝説</div>
                <div class="achievement-desc">100ターン生存</div>
            </div>
        </div>
        <div class="achievement-item">
            <span class="lock" id="ach-150">☐</span>
            <div>
                <div class="achievement-title">狩人王</div>
                <div class="achievement-desc">150ターン生存</div>
            </div>
        </div>
        <div class="achievement-item">
            <span class="lock" id="ach-200">☐</span>
            <div>
                <div class="achievement-title">神</div>
                <div class="achievement-desc">200ターン生存</div>
            </div>
        </div>
         <div class="achievement-item">
            <span class="lock" id="ach-300">☐</span>
            <div>
                <div class="achievement-title">Beast Hunter</div>
                <div class="achievement-desc">300ターン生存</div>
            </div>
        </div>
    </div>

    <div id="achievement-stats">
        <div>
            累計撃破数
            <span id="total-kills">0</span>
        </div>
        <div>
            最高生存ターン Normal
            <span id="best-survival">0</span>
        </div>
         <div>
            最高生存ターン Rock
            <span id="rock-best-survival">0</span>
        </div>
    </div>

    <button id="back-button">
        Back
    </button>

</div>

<div id="gameover-screen">

    <img
        id="gameover-logo"
        src="assets/ui/gameover.png"
        alt="Game Over">

    <div id="gameover-log"></div>

    <button id="retry-button">
        Retry
    </button>

    <button id="title-button">
        Title
    </button>

</div>

<body>
  <div id="title-screen">
      <img
      id="title-logo"
      src="assets/ui/title.png"
      alt="Hunter vs Beasts">
      
      <div id="title-menu">
      
        <button id="start-button">
          Start
        </button>
        
        <button id="continue-button" style="display:none;">
            Continue
        </button>

        <button id="achievement-button">
          Achievements
        </button>

  </div>

</div>
  <div id="controls">
    <select id="mode-select" onchange="initGame()">
      <option value="normal">Mode: Normal</option>
      <option value="rock">Mode: Rock</option>
    </select>
    <button onclick="initGame()">Reset</button>
  </div>

  <div id="stats">
    <div>Turn: <span id="current-turn">0</span></div>
    <div>Today: <span id="today-best">0</span></div>
    <div>Best: <span id="best-turn">0</span></div>
  </div>

  <div id="board-container">
    <div id="grid"></div>
    <div id="pieces-layer"></div>
  </div>

  <div id="log"></div>

<script src="js/save.js"></script>
<script src="js/achievements.js"></script>
<script src="js/ui.js"></script>
<script src="js/effects.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/game.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./serviceWorker.js");
  });
}
</script>
</body>
</html>
